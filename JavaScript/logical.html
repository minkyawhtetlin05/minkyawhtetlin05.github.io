<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical</title>
</head>
<body>
    <h1>Logical Lessons</h1>

    <script>
        // OR operator || 
        let num1 = 10;
        let num2 = 20;
        // at least one word is correct they will be true whatever false
        console.log(num1 < num2 || num1 == num2); // true | false = true 


        // AND operator && 
        // one word is incorrect = false
        console.log(num1 < num2 && num1 == num2); // ture & false = false

        //  NOT operator !
        let num3 = 10;
        console.log(!num3); // false
    </script>
    
</body>
</html>
