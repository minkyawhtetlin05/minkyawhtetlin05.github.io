<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
</head>
<body>
    <h1>Homework</h1>
    <script>
        let num = Number(prompt("Enter a number"));

        for (let i = 1; i <= 12; i++) {
            document.write(`<h3>${num} × ${i} = ${num * i}</h3>`);
        }


        // star down
        for (let i = 1; i <= 5; i++) {
            let row = "";

            for (let j = 1; j <= i; j++) {
                row += "*";
            }
            document.write(row + "<br>");
        }

        // star up
        for (let i = 5; i >= 1; i--) {
            let row = "";

            for (let j = 1; j <= i; j++) {
                row += "*";
            }
            document.write(row + "<br>");
        }
    </script>
    
</body>
</html>
